<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quake III Arena — WebAssembly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Quake III Arena</h1>
    <form id="launcher-form">
      <label>Player name <input id="player-name" maxlength="32" required autocomplete="nickname"></label>
      <label>Graphics
        <select id="graphics-profile">
          <option value="low">Low</option><option value="medium">Medium</option>
          <option value="high">High</option><option value="ultra">Ultra</option>
        </select>
      </label>
      <fieldset>
        <legend>Legally owned Steam data</legend>
        <p>Select the <code>baseq3</code> directory. Files are validated locally and mounted read-only; they are never uploaded.</p>
        <button id="choose-directory" type="button">Choose baseq3 folder</button>
        <label class="fallback">or choose pak0.pk3–pak8.pk3
          <input id="pak-files" type="file" accept=".pk3" multiple>
        </label>
      </fieldset>
      <button id="play" type="submit" disabled>Play</button>
    </form>
    <canvas id="game-canvas" hidden tabindex="0"></canvas>
    <p id="status" role="status">Choose your game data to begin.</p>
  </main>
  <script src="assets.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
